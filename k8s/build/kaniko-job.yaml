apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=Dockerfile"
        - "--context=https://github.com/jhart99/llama-cpp-dgx.git"
        - "--destination=ghcr.io/jhart99/llama-cpp-dgx:latest"
        - "--target=server"
        - "--cache=true"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: kaniko-secret
          mountPath: /kaniko/.docker
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      # Add tolerations if your arm64 nodes have taints
      # tolerations:
      # - key: "arch"
      #   operator: "Equal"
      #   value: "arm64"
      #   effect: "NoSchedule"
      volumes:
      - name: kaniko-secret
        secret:
          secretName: ghcr-secret
          items:
            - key: .dockerconfigjson
              path: config.json
  backoffLimit: 1
